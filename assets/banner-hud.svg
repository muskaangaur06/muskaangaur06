      <text x="58" y="236" font-size="16" fill="#ffb89f" letter-spacing="1.8">FORECASTING</text>
      <text x="58" y="254" font-size="14" fill="#a06b55">anomaly detection</text>
      <text x="58" y="270" font-size="14" fill="#a06b55">causal inference</text>

      <rect x="319" y="214" width="262" height="56" fill="#100705" stroke="#47241a" stroke-width="1"/>
      <text x="335" y="236" font-size="16" fill="#ffb89f" letter-spacing="1.8">RETRIEVAL</text>
      <text x="335" y="254" font-size="14" fill="#a06b55">rag · graphrag</text>
      <text x="335" y="270" font-size="14" fill="#a06b55">agentic systems</text>

      <rect x="596" y="214" width="262" height="56" fill="#100705" stroke="#47241a" stroke-width="1"/>
      <text x="612" y="236" font-size="16" fill="#ffb89f" letter-spacing="1.8">DELIVERY</text>
      <text x="612" y="254" font-size="14" fill="#a06b55">notebook through</text>
      <text x="612" y="270" font-size="14" fill="#a06b55">to deployed service</text>
    </g>

    <rect width="900" height="292" rx="3" fill="none" stroke="#47241a" stroke-width="1.5"/>
