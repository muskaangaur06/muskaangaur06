<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 292" width="900" height="292" role="img" aria-label="Muskaan Gaur, AI and ML Engineer">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080503"/>
      <stop offset="0.55" stop-color="#150907"/>
      <stop offset="1" stop-color="#25100a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0602f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e0602f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e0602f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e2a13"/>
      <stop offset="1" stop-color="#e0602f"/>
    </linearGradient>
    <clipPath id="hclip"><rect width="900" height="292" rx="3"/></clipPath>
