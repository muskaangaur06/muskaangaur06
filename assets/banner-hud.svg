    <g stroke="#e0602f" stroke-opacity="0.09" stroke-width="1">
      <path d="M0 0v292M36 0v292M72 0v292M108 0v292M144 0v292M180 0v292M216 0v292M252 0v292M288 0v292M324 0v292M360 0v292M396 0v292M432 0v292M468 0v292M504 0v292M540 0v292M576 0v292M612 0v292M648 0v292M684 0v292M720 0v292M756 0v292M792 0v292M828 0v292M864 0v292"/>
      <path d="M0 36h900M0 72h900M0 108h900M0 144h900M0 180h900M0 216h900M0 252h900"/>
    </g>

    <rect x="0" y="-70" width="900" height="70" fill="url(#scan)">
      <animate attributeName="y" values="-70;292" dur="5s" repeatCount="indefinite"/>
    </rect>

    <g stroke="#e0602f" stroke-opacity="0.45" stroke-width="2" fill="none">
      <path d="M12 48h30M12 48v26"/>
      <path d="M888 48h-30M888 48v26"/>
      <path d="M12 280h30M12 280v-26"/>
      <path d="M888 280h-30M888 280v-26"/>
    </g>

    <rect x="0" y="0" width="900" height="36" fill="#150a06"/>
    <line x1="0" y1="36" x2="900" y2="36" stroke="#47241a" stroke-width="1"/>
    <circle cx="22" cy="18" r="4" fill="#e0602f">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="24" font-family="ui-monospace, monospace" font-size="15" fill="#e0602f" letter-spacing="2.6">PROFILE // MG.01</text>
    <text x="878" y="24" font-family="ui-monospace, monospace" font-size="15" fill="#e0602f" letter-spacing="2.6" text-anchor="end">STATUS: ACTIVE</text>

    <g font-family="ui-monospace, monospace">
      <text x="40" y="98" font-size="46" font-weight="700" fill="#ffc9b4" letter-spacing="-0.5">MUSKAAN GAUR</text>
      <text x="42" y="130" font-size="19" fill="#e0602f" letter-spacing="5.4">AI / ML ENGINEER</text>
      <text x="42" y="162" font-size="18" fill="#b8836c">catching the quiet failure before the loud one</text>
    </g>

    <g>
      <rect x="42" y="180" width="816" height="26" fill="#100604" stroke="#47241a" stroke-width="1"/>
      <rect x="43" y="181" width="0" height="24" fill="url(#fill)">
        <animate attributeName="width" values="0;742" dur="2.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.75 0.3 1" keyTimes="0;1"/>
      </rect>
      <text x="450" y="198" font-family="ui-monospace, monospace" font-size="15"
            fill="#ffdfd3" letter-spacing="3" text-anchor="middle">ESTABLISHING CONNECTION</text>
    </g>

    <g font-family="ui-monospace, monospace">
