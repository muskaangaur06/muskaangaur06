<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Muskaan Gaur, AI and ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070a"/>
      <stop offset="0.6" stop-color="#061410"/>
      <stop offset="1" stop-color="#08201b"/>
    </linearGradient>
    <linearGradient id="vf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04070a" stop-opacity="0.94"/>
      <stop offset="0.5" stop-color="#04070a" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#04070a" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="230" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="230" fill="url(#bg)"/>

    <!-- falling glyph columns -->
    <g font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="13" fill="#4fd8c4">
      <g opacity="0.34"><text x="30" y="0">0 1 { } &lt; &gt; 1 0 / \ 1</text>
        <animateTransform attributeName="transform" type="translate" values="0,-40; 0,270" dur="7s" repeatCount="indefinite"/></g>
      <g opacity="0.24"><text x="96" y="0">1 [ ] = + 0 1 * - 1 0</text>
        <animateTransform attributeName="transform" type="translate" values="0,-120; 0,270" dur="9.5s" repeatCount="indefinite"/></g>
      <g opacity="0.30"><text x="162" y="0">{ } 0 1 | / 1 0 &lt; &gt;</text>
        <animateTransform attributeName="transform" type="translate" values="0,-200; 0,270" dur="6.2s" repeatCount="indefinite"/></g>
      <g opacity="0.20"><text x="228" y="0">0 0 1 \ = 1 { } 0 1</text>
        <animateTransform attributeName="transform" type="translate" values="0,-60; 0,270" dur="11s" repeatCount="indefinite"/></g>
      <g opacity="0.26"><text x="294" y="0">1 + - 0 [ ] 1 0 / 1</text>
        <animateTransform attributeName="transform" type="translate" values="0,-160; 0,270" dur="8.1s" repeatCount="indefinite"/></g>
      <g opacity="0.18"><text x="360" y="0">&lt; &gt; 1 0 { } = 0 1</text>
        <animateTransform attributeName="transform" type="translate" values="0,-30; 0,270" dur="10.4s" repeatCount="indefinite"/></g>
      <g opacity="0.28"><text x="700" y="0">0 1 / \ { } 1 0 + =</text>
        <animateTransform attributeName="transform" type="translate" values="0,-90; 0,270" dur="7.6s" repeatCount="indefinite"/></g>
      <g opacity="0.22"><text x="766" y="0">1 0 [ ] &lt; &gt; 0 1 |</text>
        <animateTransform attributeName="transform" type="translate" values="0,-210; 0,270" dur="9.9s" repeatCount="indefinite"/></g>
      <g opacity="0.30"><text x="832" y="0">{ } = 1 0 / 1 - 0</text>
        <animateTransform attributeName="transform" type="translate" values="0,-140; 0,270" dur="6.8s" repeatCount="indefinite"/></g>
      <g opacity="0.20"><text x="898" y="0">0 1 * + { } 0 1 \</text>
        <animateTransform attributeName="transform" type="translate" values="0,-50; 0,270" dur="12s" repeatCount="indefinite"/></g>
      <g opacity="0.24"><text x="952" y="0">1 &lt; &gt; 0 [ ] 1 0</text>
        <animateTransform attributeName="transform" type="translate" values="0,-180; 0,270" dur="8.7s" repeatCount="indefinite"/></g>
    </g>

    <!-- readability veil over the text side -->
    <rect width="700" height="230" fill="url(#vf)"/>

    <!-- content -->
    <g font-family="ui-monospace, 'IBM Plex Mono', monospace">
      <text x="46" y="48" font-size="12" fill="#2f7d70" letter-spacing="1.8">$ whoami</text>

      <text x="46" y="106" font-size="40" font-weight="700" fill="#e2fff8" letter-spacing="-1">MUSKAAN <tspan fill="#4fd8c4">GAUR</tspan></text>

      <text x="48" y="134" font-size="12.5" fill="#4fd8c4" letter-spacing="4.2">AI / ML ENGINEER</text>

      <!-- cycling statement -->
      <g font-size="13.5" fill="#8fb3ab">
        <text x="48" y="172" opacity="0">the model is the short part
          <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" dur="13.5s" repeatCount="indefinite"/></text>
        <text x="48" y="172" opacity="0">normal is per system, never inherited
          <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" dur="13.5s" repeatCount="indefinite"/></text>
        <text x="48" y="172" opacity="0">the fallback ships before the clever path
          <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;1" dur="13.5s" repeatCount="indefinite"/></text>
      </g>

      <!-- blinking caret -->
      <rect x="48" y="188" width="8" height="15" fill="#4fd8c4">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="64" y="200" font-size="11.5" fill="#2f7d70" letter-spacing="1.4">_</text>
    </g>

    <rect width="1000" height="230" rx="6" fill="none" stroke="#17433a" stroke-width="1.5"/>
  </g>
</svg>
