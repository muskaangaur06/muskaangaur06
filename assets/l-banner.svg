<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Muskaan Gaur, AI and ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#fbfdfc"/><stop offset="1" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="230" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="230" fill="url(#bg)"/>

    <g font-family="ui-monospace, monospace" font-size="17" font-weight="500" fill="#0f9c7e">
      <g opacity="0.78"><text x="16" y="0">8 ｰ ﾊ ﾈ ﾆ = ﾐ ﾐ</text><animateTransform attributeName="transform" type="translate" values="0,-278; 0,270" dur="11.2s" repeatCount="indefinite"/></g>
      <g opacity="0.65"><text x="68" y="0">ｶ 2 ｱ ﾙ : ｲ ﾓ ｺ</text><animateTransform attributeName="transform" type="translate" values="0,-112; 0,270" dur="11.1s" repeatCount="indefinite"/></g>
      <g opacity="0.69"><text x="120" y="0">ﾀ 5 ﾎ ﾋ ｾ ﾁ 0 ﾅ</text><animateTransform attributeName="transform" type="translate" values="0,-58; 0,270" dur="8.4s" repeatCount="indefinite"/></g>
      <g opacity="0.8"><text x="172" y="0">ﾙ ﾝ ﾐ ｴ 0 ﾖ ｿ ｴ</text><animateTransform attributeName="transform" type="translate" values="0,-190; 0,270" dur="11.6s" repeatCount="indefinite"/></g>
      <g opacity="0.63"><text x="224" y="0">6 ﾆ ﾏ ﾆ ﾓ ｻ ｸ ﾆ</text><animateTransform attributeName="transform" type="translate" values="0,-187; 0,270" dur="13.3s" repeatCount="indefinite"/></g>
      <g opacity="0.7"><text x="692" y="0">ｾ ｼ ｳ ﾎ ｾ ﾁ 7 ﾓ</text><animateTransform attributeName="transform" type="translate" values="0,-40; 0,270" dur="13.9s" repeatCount="indefinite"/></g>
      <g opacity="0.74"><text x="744" y="0">ｹ ﾀ ﾓ ｶ ﾘ ｶ ｦ ｳ</text><animateTransform attributeName="transform" type="translate" values="0,-178; 0,270" dur="13.4s" repeatCount="indefinite"/></g>
      <g opacity="0.91"><text x="796" y="0">ﾙ 4 ﾋ ﾔ ﾗ ｰ ｴ ｾ</text><animateTransform attributeName="transform" type="translate" values="0,-278; 0,270" dur="8.1s" repeatCount="indefinite"/></g>
      <g opacity="0.76"><text x="848" y="0">ｱ ﾊ ﾚ 1 ｱ ﾜ ﾘ ﾐ</text><animateTransform attributeName="transform" type="translate" values="0,-99; 0,270" dur="12.5s" repeatCount="indefinite"/></g>
    </g>

    <rect x="222" y="0" width="40" height="230" fill="url(#fadeL)"/>
    <rect x="638" y="0" width="40" height="230" fill="url(#fadeR)"/>
    <rect x="262" y="0" width="376" height="230" fill="#ffffff" opacity="0.92"/>

    <g font-family="ui-monospace, monospace">
      <text x="450" y="52" text-anchor="middle" font-size="15" fill="#4a6b63" letter-spacing="2">$ whoami</text>
      <text x="450" y="112" text-anchor="middle" font-size="46" font-weight="700" fill="#000000" letter-spacing="-1">MUSKAAN <tspan fill="#047857">GAUR</tspan></text>
      <text x="450" y="144" text-anchor="middle" font-size="19" fill="#047857" letter-spacing="5.4">AI / ML ENGINEER</text>
      <g font-size="17" fill="#1a1f1e">
        <text x="450" y="186" text-anchor="middle" opacity="0">the model is the short part
          <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" dur="13.5s" repeatCount="indefinite"/></text>
        <text x="450" y="186" text-anchor="middle" opacity="0">normal is per system, never inherited
          <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" dur="13.5s" repeatCount="indefinite"/></text>
        <text x="450" y="186" text-anchor="middle" opacity="0">the fallback ships before the clever path
          <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;1" dur="13.5s" repeatCount="indefinite"/></text>
      </g>
      <rect x="446" y="202" width="9" height="17" fill="#047857">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect width="900" height="230" rx="6" fill="none" stroke="#d0d7d5" stroke-width="1.5"/>
  </g>
</svg>
