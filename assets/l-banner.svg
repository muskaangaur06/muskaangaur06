<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Muskaan Gaur, AI and ML Engineer">
  <defs>
    <linearGradient id="bgl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#fbfdfc"/><stop offset="1" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="veill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.48"/>
    </linearGradient>
    <clipPath id="cl"><rect width="900" height="230" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#cl)">
    <rect width="900" height="230" fill="url(#bgl)"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#047857">
      <g opacity="0.30"><text x="26" y="0">8 ｰ ﾊ ﾈ ﾆ = ﾐ ﾐ ﾌ ｱ</text><animateTransform attributeName="transform" type="translate" values="0,-278; 0,270" dur="12.6s" repeatCount="indefinite"/></g>
      <g opacity="0.32"><text x="88" y="0">ｱ ﾙ : ｲ ﾓ ｺ ｦ ﾇ ｹ ｰ</text><animateTransform attributeName="transform" type="translate" values="0,-61; 0,270" dur="10.1s" repeatCount="indefinite"/></g>
      <g opacity="0.34"><text x="150" y="0">ｾ ﾁ 0 ﾅ ﾇ ﾗ ｻ ｴ ﾋ ﾙ</text><animateTransform attributeName="transform" type="translate" values="0,-55; 0,270" dur="16.0s" repeatCount="indefinite"/></g>
      <g opacity="0.28"><text x="212" y="0">0 ﾖ ｿ ｴ ﾑ ﾈ ﾅ ﾎ ｺ 6</text><animateTransform attributeName="transform" type="translate" values="0,-182; 0,270" dur="12.7s" repeatCount="indefinite"/></g>
      <g opacity="0.25"><text x="274" y="0">ﾓ ｻ ｸ ﾆ ﾊ ﾎ ﾘ ｾ ｼ ｳ</text><animateTransform attributeName="transform" type="translate" values="0,-245; 0,270" dur="15.1s" repeatCount="indefinite"/></g>
      <g opacity="0.28"><text x="336" y="0">7 ﾓ ﾚ ﾍ ﾚ ｹ ﾀ ﾓ ｶ ﾘ</text><animateTransform attributeName="transform" type="translate" values="0,-243; 0,270" dur="16.8s" repeatCount="indefinite"/></g>
      <g opacity="0.23"><text x="398" y="0">ｰ ｱ ﾙ 4 ﾋ ﾔ ﾗ ｰ ｴ ｾ</text><animateTransform attributeName="transform" type="translate" values="0,-91; 0,270" dur="10.1s" repeatCount="indefinite"/></g>
      <g opacity="0.28"><text x="460" y="0">ｱ ﾊ ﾚ 1 ｱ ﾜ ﾘ ﾐ ﾘ 6</text><animateTransform attributeName="transform" type="translate" values="0,-99; 0,270" dur="14.1s" repeatCount="indefinite"/></g>
      <g opacity="0.23"><text x="522" y="0">ﾈ ﾎ ﾄ ﾄ ｳ + ﾈ ﾜ ｻ ﾁ</text><animateTransform attributeName="transform" type="translate" values="0,-91; 0,270" dur="14.1s" repeatCount="indefinite"/></g>
      <g opacity="0.32"><text x="584" y="0">ﾇ ﾓ 5 ﾊ ﾋ ﾚ ｹ 8 ｵ 2</text><animateTransform attributeName="transform" type="translate" values="0,-146; 0,270" dur="9.6s" repeatCount="indefinite"/></g>
      <g opacity="0.25"><text x="646" y="0">ﾍ ｹ ｷ + ｲ ｰ ｸ 1 ﾅ ﾜ</text><animateTransform attributeName="transform" type="translate" values="0,-237; 0,270" dur="10.1s" repeatCount="indefinite"/></g>
      <g opacity="0.28"><text x="708" y="0">ﾅ ﾆ ﾒ ﾈ ｿ ｽ ｵ ﾁ ﾈ 3</text><animateTransform attributeName="transform" type="translate" values="0,-80; 0,270" dur="16.1s" repeatCount="indefinite"/></g>
      <g opacity="0.36"><text x="770" y="0">ｺ ﾏ ｷ ﾜ 4 : = ﾁ ﾋ ｱ</text><animateTransform attributeName="transform" type="translate" values="0,-129; 0,270" dur="12.9s" repeatCount="indefinite"/></g>
      <g opacity="0.34"><text x="832" y="0">ｺ ﾙ ｷ ﾌ ｲ ﾇ ﾑ ﾙ ｰ ﾊ</text><animateTransform attributeName="transform" type="translate" values="0,-144; 0,270" dur="16.3s" repeatCount="indefinite"/></g>
      <g opacity="0.25"><text x="894" y="0">ﾑ ﾖ ｽ ｦ 7 ﾕ 0 ﾏ ｻ ﾆ</text><animateTransform attributeName="transform" type="translate" values="0,-107; 0,270" dur="13.2s" repeatCount="indefinite"/></g>
    </g>
    <rect width="900" height="230" fill="url(#veill)"/>
    <g font-family="ui-monospace, monospace">
      <text x="450" y="52" text-anchor="middle" font-size="15" fill="#5a6663" letter-spacing="2">$ whoami</text>
      <text x="450" y="112" text-anchor="middle" font-size="46" font-weight="700" fill="#000000" letter-spacing="-1">MUSKAAN <tspan fill="#047857">GAUR</tspan></text>
      <text x="450" y="144" text-anchor="middle" font-size="19" fill="#047857" letter-spacing="5.4">AI / ML ENGINEER</text>
      <g font-size="17" fill="#1a1f1e">
        <text x="450" y="186" text-anchor="middle" opacity="0">the model is the short part
          <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" dur="13.5s" repeatCount="indefinite"/></text>
        <text x="450" y="186" text-anchor="middle" opacity="0">normal is per system, never inherited
          <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" dur="13.5s" repeatCount="indefinite"/></text>
        <text x="450" y="186" text-anchor="middle" opacity="0">the fallback ships before the clever path
          <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;1" dur="13.5s" repeatCount="indefinite"/></text>
      </g>
      <rect x="446" y="202" width="9" height="17" fill="#047857">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect width="900" height="230" rx="6" fill="none" stroke="#d0d7d5" stroke-width="1.5"/>
  </g>
</svg>
