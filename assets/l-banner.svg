<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Muskaan Gaur, AI and ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#fbfdfc"/><stop offset="1" stop-color="#f6faf9"/>
    </linearGradient>
    <linearGradient id="fadeIn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="1"/></linearGradient>
    <linearGradient id="fadeOut" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="900" height="230" rx="6"/></clipPath>
    <clipPath id="left"><rect x="0" y="0" width="200" height="230"/></clipPath>
    <clipPath id="right"><rect x="700" y="0" width="200" height="230"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="230" fill="url(#bg)"/>

    <g font-family="ui-monospace, monospace" font-size="17" font-weight="500" fill="#0f9c7e">
      <g opacity="0.81"><text x="14" y="0">8 ｰ ﾊ ﾈ ﾆ</text><animateTransform attributeName="transform" type="translate" values="0,-278; 0,270" dur="11.2s" repeatCount="indefinite"/></g>
      <g opacity="0.68"><text x="60" y="0">ｱ ﾗ ﾝ ﾌ ｶ</text><animateTransform attributeName="transform" type="translate" values="0,-135; 0,270" dur="12.4s" repeatCount="indefinite"/></g>
      <g opacity="0.99"><text x="710" y="0">: ｲ ﾓ ｺ ｦ</text><animateTransform attributeName="transform" type="translate" values="0,-242; 0,270" dur="12.2s" repeatCount="indefinite"/></g>
      <g opacity="0.96"><text x="756" y="0">5 ﾎ ﾋ ｾ ﾁ</text><animateTransform attributeName="transform" type="translate" values="0,-137; 0,270" dur="8.4s" repeatCount="indefinite"/></g>
      <g opacity="0.83"><text x="802" y="0">ｻ ｴ ﾋ ﾙ ﾝ</text><animateTransform attributeName="transform" type="translate" values="0,-140; 0,270" dur="12.1s" repeatCount="indefinite"/></g>
      <g opacity="1.0"><text x="848" y="0">ﾖ ｿ ｴ ﾑ ﾈ</text><animateTransform attributeName="transform" type="translate" values="0,-248; 0,270" dur="12.6s" repeatCount="indefinite"/></g>
      </g>
      <g opacity="0.81"><text x="14" y="0">8 ｰ ﾊ ﾈ ﾆ</text><animateTransform attributeName="transform" type="translate" values="0,-278; 0,270" dur="11.2s" repeatCount="indefinite"/></g>
      <g opacity="0.68"><text x="60" y="0">ｱ ﾗ ﾝ ﾌ ｶ</text><animateTransform attributeName="transform" type="translate" values="0,-135; 0,270" dur="12.4s" repeatCount="indefinite"/></g>
      <g opacity="0.99"><text x="710" y="0">: ｲ ﾓ ｺ ｦ</text><animateTransform attributeName="transform" type="translate" values="0,-242; 0,270" dur="12.2s" repeatCount="indefinite"/></g>
      <g opacity="0.96"><text x="756" y="0">5 ﾎ ﾋ ｾ ﾁ</text><animateTransform attributeName="transform" type="translate" values="0,-137; 0,270" dur="8.4s" repeatCount="indefinite"/></g>
      <g opacity="0.83"><text x="802" y="0">ｻ ｴ ﾋ ﾙ ﾝ</text><animateTransform attributeName="transform" type="translate" values="0,-140; 0,270" dur="12.1s" repeatCount="indefinite"/></g>
      <g opacity="1.0"><text x="848" y="0">ﾖ ｿ ｴ ﾑ ﾈ</text><animateTransform attributeName="transform" type="translate" values="0,-248; 0,270" dur="12.6s" repeatCount="indefinite"/></g>
    </g>

    <rect x="196" y="0" width="508" height="230" fill="#ffffff"/>
    <rect x="176" y="0" width="20" height="230" fill="url(#fadeIn)"/>
    <rect x="704" y="0" width="20" height="230" fill="url(#fadeOut)"/>
    <g font-family="ui-monospace, monospace">
      <text x="450" y="52" text-anchor="middle" font-size="15" fill="#4a6b63" letter-spacing="2">$ whoami</text>
      <text x="450" y="112" text-anchor="middle" font-size="46" font-weight="700" fill="#000000" letter-spacing="-1">MUSKAAN <tspan fill="#047857">GAUR</tspan></text>
      <text x="450" y="144" text-anchor="middle" font-size="19" fill="#047857" letter-spacing="5.4">AI / ML ENGINEER</text>
      <g font-size="17" fill="#1a1f1e">
        <text x="450" y="186" text-anchor="middle" opacity="0">the model is the short part
          <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" dur="13.5s" repeatCount="indefinite"/></text>
        <text x="450" y="186" text-anchor="middle" opacity="0">normal is per system, never inherited
          <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" dur="13.5s" repeatCount="indefinite"/></text>
        <text x="450" y="186" text-anchor="middle" opacity="0">the fallback ships before the clever path
          <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;1" dur="13.5s" repeatCount="indefinite"/></text>
      </g>
      <rect x="446" y="202" width="9" height="17" fill="#047857">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect width="900" height="230" rx="6" fill="none" stroke="#d0d7d5" stroke-width="1.5"/>
  </g>
</svg>
