<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Working principles">
<rect width="1200" height="210" fill="#0d0604" stroke="#47241a" stroke-width="1"/>
<rect width="1200" height="30" fill="#160a06"/>
<line x1="0" y1="30" x2="1200" y2="30" stroke="#47241a" stroke-width="1"/>
<rect x="0" y="0" width="4" height="30" fill="#e0602f"/>
<text x="20" y="20" font-family="ui-monospace, monospace" font-size="11" fill="#e0602f" letter-spacing="3.4">FAILURE MODES</text>
<text x="1180" y="20" font-family="ui-monospace, monospace" font-size="11" fill="#8a4a30" letter-spacing="3.4" text-anchor="end">04</text>
<text x="24" y="50" font-family="ui-monospace, monospace" font-size="9" fill="#6b3a26" letter-spacing="2">WHAT BREAKS</text>
<text x="330" y="50" font-family="ui-monospace, monospace" font-size="9" fill="#6b3a26" letter-spacing="2">COMMON FIX</text>
<text x="620" y="50" font-family="ui-monospace, monospace" font-size="9" fill="#6b3a26" letter-spacing="2">WHAT I DO</text>
<text x="24" y="74" font-family="ui-monospace, monospace" font-size="11.5" fill="#c08a72">model drifts silently</text>
<text x="330" y="74" font-family="ui-monospace, monospace" font-size="11.5" fill="#7d5140">retrain on a schedule</text>
<text x="620" y="74" font-family="ui-monospace, monospace" font-size="11.5" fill="#ffb89f">monitor the residual, swap atomically, keep old weights on failure</text>
<line x1="24" y1="86" x2="1176" y2="86" stroke="#2e1710" stroke-width="1"/>
<text x="24" y="108" font-family="ui-monospace, monospace" font-size="11.5" fill="#c08a72">generated text is wrong</text>
<text x="330" y="108" font-family="ui-monospace, monospace" font-size="11.5" fill="#7d5140">write a better prompt</text>
<text x="620" y="108" font-family="ui-monospace, monospace" font-size="11.5" fill="#ffb89f">check against source, discard below threshold, ship the rule based path</text>
<line x1="24" y1="120" x2="1176" y2="120" stroke="#2e1710" stroke-width="1"/>
<text x="24" y="142" font-family="ui-monospace, monospace" font-size="11.5" fill="#c08a72">rare events get missed</text>
<text x="330" y="142" font-family="ui-monospace, monospace" font-size="11.5" fill="#7d5140">oversample the minority</text>
<text x="620" y="142" font-family="ui-monospace, monospace" font-size="11.5" fill="#ffb89f">price the false negative, then set the threshold on that number</text>
<line x1="24" y1="154" x2="1176" y2="154" stroke="#2e1710" stroke-width="1"/>
<text x="24" y="176" font-family="ui-monospace, monospace" font-size="11.5" fill="#c08a72">nobody uses the output</text>
<text x="330" y="176" font-family="ui-monospace, monospace" font-size="11.5" fill="#7d5140">build another dashboard</text>
<text x="620" y="176" font-family="ui-monospace, monospace" font-size="11.5" fill="#ffb89f">find the decision it was meant to change, ask why it did not</text>
<line x1="24" y1="188" x2="1176" y2="188" stroke="#2e1710" stroke-width="1"/>
</svg>