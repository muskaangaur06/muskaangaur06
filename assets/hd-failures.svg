<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 214" width="900" height="214" role="img" aria-label="Failure modes">
<rect width="900" height="214" fill="#0d0604" stroke="#47241a" stroke-width="1"/>
<rect width="900" height="34" fill="#160a06"/>
<line x1="0" y1="34" x2="900" y2="34" stroke="#47241a" stroke-width="1"/>
<rect x="0" y="0" width="4" height="34" fill="#e0602f"/>
<text x="20" y="23" font-family="ui-monospace, monospace" font-size="12" fill="#e0602f" letter-spacing="3.2">FAILURE MODES</text>
<text x="880" y="23" font-family="ui-monospace, monospace" font-size="12" fill="#8a4a30" letter-spacing="3.2" text-anchor="end">04</text>
<text x="22" y="58" font-family="ui-monospace, monospace" font-size="10" fill="#6b3a26" letter-spacing="1.8">WHAT BREAKS</text>
<text x="268" y="58" font-family="ui-monospace, monospace" font-size="10" fill="#6b3a26" letter-spacing="1.8">COMMON FIX</text>
<text x="520" y="58" font-family="ui-monospace, monospace" font-size="10" fill="#6b3a26" letter-spacing="1.8">WHAT I DO</text>
<text x="22" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c08a72">model drifts silently</text>
<text x="268" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#7d5140">retrain on a schedule</text>
<text x="520" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffb89f">monitor the residual, swap atomically</text>
<line x1="22" y1="102" x2="878" y2="102" stroke="#2e1710" stroke-width="1"/>
<text x="22" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c08a72">generated text is wrong</text>
<text x="268" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#7d5140">write a better prompt</text>
<text x="520" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffb89f">check against source, ship the rule path</text>
<line x1="22" y1="134" x2="878" y2="134" stroke="#2e1710" stroke-width="1"/>
<text x="22" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c08a72">rare events get missed</text>
<text x="268" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#7d5140">oversample the minority</text>
<text x="520" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffb89f">price the false negative, set on that</text>
<line x1="22" y1="166" x2="878" y2="166" stroke="#2e1710" stroke-width="1"/>
<text x="22" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c08a72">nobody uses the output</text>
<text x="268" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#7d5140">build another dashboard</text>
<text x="520" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffb89f">find the decision it was meant to change</text>
<line x1="22" y1="198" x2="878" y2="198" stroke="#2e1710" stroke-width="1"/>
</svg>