<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 258" width="900" height="258" role="img" aria-label="ABOUT">
<rect width="900" height="258" fill="#0d0604" stroke="#47241a" stroke-width="1" rx="2"/>
<rect width="900" height="34" fill="#160a06"/>
<line x1="0" y1="34" x2="900" y2="34" stroke="#47241a" stroke-width="1"/>
<rect x="0" y="0" width="4" height="34" fill="#e0602f"/>
<text x="20" y="23" font-family="ui-monospace, monospace" font-size="12" fill="#e0602f" letter-spacing="3.2">ABOUT</text>
<text x="880" y="23" font-family="ui-monospace, monospace" font-size="12" fill="#8a4a30" letter-spacing="3.2" text-anchor="end">01</text>
<text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">Something is going wrong right now in a system somebody depends on, and the numbers</text>
<text x="24" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">still look fine. By the time a threshold trips, the useful window has closed. Nearly</text>
<text x="24" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">everything I build lives in the gap between those two moments: catch the drift while</text>
<text x="24" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">there is still time to act, then explain the cause well enough that someone acts on it.</text>
<text x="24" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">The interesting problem is almost never the model. It is knowing what normal means for</text>
<text x="24" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">this system, and refusing to borrow that answer from somewhere else.</text>
</svg>