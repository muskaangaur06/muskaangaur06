<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 322" width="1200" height="322" role="img" aria-label="METHOD">
<rect width="1200" height="322" fill="#0d0604" stroke="#47241a" stroke-width="1" rx="2"/>
<rect width="1200" height="32" fill="#160a06"/>
<line x1="0" y1="32" x2="1200" y2="32" stroke="#47241a" stroke-width="1"/>
<rect x="0" y="0" width="4" height="32" fill="#e0602f"/>
<text x="22" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#e0602f" letter-spacing="3.4">METHOD</text>
<text x="1178" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#8a4a30" letter-spacing="3.4" text-anchor="end">02</text>
<text x="24" y="56" font-family="ui-monospace, monospace" font-size="13"><tspan fill="#ffd0bd" font-weight="700">Constants come from the system in front of me.</tspan> <tspan fill="#c9a494">Thresholds, weights and baselines get built from</tspan></text>
<text x="24" y="77" font-family="ui-monospace, monospace" font-size="13" fill="#c9a494">that system's own data. Inheriting them from a similar looking system is how you ship a model that is</text>
<text x="24" y="98" font-family="ui-monospace, monospace" font-size="13" fill="#c9a494">confidently wrong.</text>
<text x="24" y="131" font-family="ui-monospace, monospace" font-size="13"><tspan fill="#ffd0bd" font-weight="700">A detection nobody can explain is a detection nobody uses.</tspan> <tspan fill="#c9a494">Flagging an anomaly is the easy half.</tspan></text>
<text x="24" y="152" font-family="ui-monospace, monospace" font-size="13" fill="#c9a494">Tracing it to a cause, with statistical testing behind the claim, turns an alert into a decision.</text>
<text x="24" y="185" font-family="ui-monospace, monospace" font-size="13"><tspan fill="#ffd0bd" font-weight="700">Deterministic where it counts, generative where it helps.</tspan> <tspan fill="#c9a494">Search, ranking and scoring stay</tspan></text>
<text x="24" y="206" font-family="ui-monospace, monospace" font-size="13" fill="#c9a494">deterministic and testable. The model writes prose. When generated text fails its check against the</text>
<text x="24" y="227" font-family="ui-monospace, monospace" font-size="13" fill="#c9a494">source, a rule based version ships instead, so the system degrades rather than lies.</text>
<text x="24" y="260" font-family="ui-monospace, monospace" font-size="13"><tspan fill="#ffd0bd" font-weight="700">Evaluation is the deliverable.</tspan> <tspan fill="#c9a494">Anyone can post a number. The work is building the split that</tspan></text>
<text x="24" y="281" font-family="ui-monospace, monospace" font-size="13" fill="#c9a494">makes the number mean something.</text>
</svg>