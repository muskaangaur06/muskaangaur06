<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" role="img" aria-label="METHOD">
<rect width="900" height="446" fill="#0d0604" stroke="#47241a" stroke-width="1" rx="2"/>
<rect width="900" height="34" fill="#160a06"/>
<line x1="0" y1="34" x2="900" y2="34" stroke="#47241a" stroke-width="1"/>
<rect x="0" y="0" width="4" height="34" fill="#e0602f"/>
<text x="20" y="23" font-family="ui-monospace, monospace" font-size="12" fill="#e0602f" letter-spacing="3.2">METHOD</text>
<text x="880" y="23" font-family="ui-monospace, monospace" font-size="12" fill="#8a4a30" letter-spacing="3.2" text-anchor="end">02</text>
<text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17"><tspan fill="#ffd8c6" font-weight="600">Constants come from the system in front of me.</tspan> <tspan fill="#d3b3a4">Thresholds, weights and</tspan></text>
<text x="24" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">baselines get built from that system's own data. Inheriting them from a similar looking</text>
<text x="24" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">system is how you ship a model that is confidently wrong.</text>
<text x="24" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17"><tspan fill="#ffd8c6" font-weight="600">A detection nobody can explain is a detection nobody uses.</tspan> <tspan fill="#d3b3a4">Flagging an</tspan></text>
<text x="24" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">anomaly is the easy half. Tracing it to a cause, with statistical testing behind the</text>
<text x="24" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">claim, is what turns an alert into a decision.</text>
<text x="24" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17"><tspan fill="#ffd8c6" font-weight="600">Deterministic where it counts, generative where it helps.</tspan> <tspan fill="#d3b3a4">Search, ranking and</tspan></text>
<text x="24" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">scoring stay deterministic and testable. The model writes prose. When generated text</text>
<text x="24" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">fails its check against the source, a rule based version ships instead, so the system</text>
<text x="24" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">degrades rather than lies.</text>
<text x="24" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17"><tspan fill="#ffd8c6" font-weight="600">Evaluation is the deliverable.</tspan> <tspan fill="#d3b3a4">Anyone can post a number. The work is building</tspan></text>
<text x="24" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#d3b3a4">the split that makes the number mean something.</text>
</svg>