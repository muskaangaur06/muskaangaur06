<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 368" width="900" height="368" role="img" aria-label="METHOD">
<rect width="900" height="368" fill="#f5f2ec" stroke="#c9c0b0" stroke-width="1" rx="2"/>
<rect width="900" height="34" fill="#e8e2d6"/>
<line x1="0" y1="34" x2="900" y2="34" stroke="#c9c0b0" stroke-width="1"/>
<rect x="0" y="0" width="4" height="34" fill="#0f766e"/>
<text x="20" y="23" font-family="ui-monospace, monospace" font-size="12" fill="#0f766e" letter-spacing="3.2">METHOD</text>
<text x="880" y="23" font-family="ui-monospace, monospace" font-size="12" fill="#8a8272" letter-spacing="3.2" text-anchor="end">03</text>
<text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"><tspan fill="#15201d" font-weight="600">Constants come from the system in front of me.</tspan> <tspan fill="#3a4440">Thresholds, weights and baselines get built from that system's</tspan></text>
<text x="24" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#3a4440">own data. Inheriting them from a similar looking system is how you ship a model that is confidently wrong.</text>
<text x="24" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"><tspan fill="#15201d" font-weight="600">A detection nobody can explain is a detection nobody uses.</tspan> <tspan fill="#3a4440">Flagging an anomaly is the easy half. Tracing it to</tspan></text>
<text x="24" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#3a4440">a cause, with statistical testing behind the claim, is what turns an alert into a decision.</text>
<text x="24" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"><tspan fill="#15201d" font-weight="600">Deterministic where it counts, generative where it helps.</tspan> <tspan fill="#3a4440">Search, ranking and scoring stay deterministic and</tspan></text>
<text x="24" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#3a4440">testable. The model writes prose. When generated text fails its check against the source, a rule based version ships</text>
<text x="24" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#3a4440">instead, so the system degrades rather than lies.</text>
<text x="24" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"><tspan fill="#15201d" font-weight="600">Evaluation is the deliverable.</tspan> <tspan fill="#3a4440">Anyone can post a number. The work is building the split that makes the number</tspan></text>
<text x="24" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#3a4440">mean something.</text>
</svg>